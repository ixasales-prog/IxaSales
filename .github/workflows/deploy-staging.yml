name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

env:
  SERVER_HOST: 176.96.241.152
  SERVER_USER: ilhom1983
  APP_ROOT: /var/www/ixasales/staging
  FRONTEND_URL: https://dev.ixasales.uz
  API_HEALTH_URL: https://dev-api.ixasales.uz/health

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build backend
        run: npm run build

      - name: Build frontend for staging
        working-directory: client
        env:
          VITE_API_URL: https://dev-api.ixasales.uz/api
          VITE_ENABLE_PWA: "false"
        run: npm run build

      - name: Prepare release artifact
        id: meta
        run: |
          ARTIFACT_NAME="staging-release-${GITHUB_SHA}.tgz"
          mkdir -p release
          cp -R dist release/dist
          mkdir -p release/client
          cp -R client/dist release/client/dist
          cp package.json package-lock.json release/
          tar -czf "${ARTIFACT_NAME}" -C release .
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.artifact_name }}
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.STAGING_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ env.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release artifact and deploy script
        run: |
          scp "${{ needs.build.outputs.artifact_name }}" "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/tmp/ixasales-staging-release.tgz"
          scp scripts/staging-release-deploy.sh "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/tmp/ixasales-staging-release-deploy.sh"

      - name: Deploy release atomically
        run: |
          ssh "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" "printf '%s\n' '${{ secrets.STAGING_SUDO_PASSWORD }}' | sudo -S env \
            APP_ROOT='${{ env.APP_ROOT }}' \
            ARTIFACT_PATH='/tmp/ixasales-staging-release.tgz' \
            FRONTEND_URL='${{ env.FRONTEND_URL }}' \
            API_HEALTH_URL='${{ env.API_HEALTH_URL }}' \
            bash /tmp/ixasales-staging-release-deploy.sh"

      - name: Verify live staging
        run: |
          curl -fsS "${{ env.API_HEALTH_URL }}"
          curl -fsS "${{ env.FRONTEND_URL }}/" | grep -q "/assets/index-"
